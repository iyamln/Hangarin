{% extends "base.html" %}

{% block title %}SubTask Form - Hangarin{% endblock %}

{% block content %}
<div class="container py-5">

    <h1 class="fw-bold mb-4">
        {% if object %}
            Edit SubTask
        {% else %}
            Add SubTask
        {% endif %}
    </h1>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-dark">
            Save SubTask
        </button>

        <a href="{% url 'subtask-list' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>
{% endblock %}
