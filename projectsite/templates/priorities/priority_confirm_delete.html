{% extends "base.html" %}

{% block title %}Delete Priority - Hangarin{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="card shadow-sm">
        <div class="card-body">

            <h1 class="fw-bold mb-3">
                Delete Priority
            </h1>

            <p>
                Are you sure you want to delete
                <strong>{{ object.name }}</strong>?
            </p>

            <form method="post">
                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Yes, Delete
                </button>

                <a
                    href="{% url 'priority-list' %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>
            </form>

        </div>
    </div>

</div>

{% endblock %}
