{% extends "base.html" %}

{% block title %}Category Form - Hangarin{% endblock %}

{% block content %}

<div class="container py-5">

    <h1 class="fw-bold mb-4">
        {% if object %}Edit Category{% else %}Add Category{% endif %}
    </h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-dark">
            Save Category
        </button>

        <a href="{% url 'category-list' %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>

</div>

{% endblock %}
