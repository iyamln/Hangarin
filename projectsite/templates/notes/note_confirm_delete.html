{% extends "base.html" %}

{% block title %}Delete Note - Hangarin{% endblock %}

{% block content %}
<div class="container py-5">

    <div class="card shadow-sm">
        <div class="card-body">

            <h1 class="fw-bold mb-3">
                Delete Note
            </h1>

            <p>
                Are you sure you want to delete this note?
            </p>

            <form method="post">
                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Yes, Delete
                </button>

                <a
                    href="{% url 'note-list' %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>
            </form>

        </div>
    </div>

</div>
{% endblock %}
